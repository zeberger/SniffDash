[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sniffdash"
version = "0.1.0"
description = "Network Traffic Analysis Dashboard (PCAP analytics + AI Q&A)"
requires-python = ">=3.11"
dependencies = [
    "pyshark>=0.6",
    "scapy>=2.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "google-genai>=1.30",
    "streamlit>=1.40",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sniffdash.llm.prompts" = ["*.md", "levels/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "tshark: requires Wireshark's tshark binary (skipped automatically if missing)",
    "live_llm: calls the real Gemini API (needs GEMINI_API_KEY; skipped otherwise; uses free-tier quota)",
]
